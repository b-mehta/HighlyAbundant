name: Lean Action CI

on:
  push:
    paths-ignore:
      - 'scripts/ha169_benchmark.sage'
      - '.github/workflows/sage_benchmark.yml'
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          build: false
      - name: Build
        shell: bash
        env:
          # 3 modules in parallel (with the HACompose169 split); more risks OOM.
          LEAN_NUM_THREADS: "3"
        run: |
          lake exe cache get || true
          lake build
