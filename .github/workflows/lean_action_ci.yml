name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          build: false
      - name: Build with bumped stack
        shell: bash
        env:
          LAKE_NO_PARALLEL: "1"
          LEAN_NUM_THREADS: "1"
        run: |
          echo "ulimit -s before: $(ulimit -s)"
          ulimit -s unlimited
          echo "ulimit -s after: $(ulimit -s)"
          echo "bash exec ulimit -s: $(bash -c 'ulimit -s')"
          cat /proc/self/limits | grep -i stack
          lake exe cache get || true
          lake build
