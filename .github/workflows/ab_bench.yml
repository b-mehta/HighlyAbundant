name: Bench

on:
  push:
    branches:
      - 'bench/**'

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          build: false

      - name: Build dependencies once
        shell: bash
        env:
          LEAN_NUM_THREADS: "3"
        run: |
          lake exe cache get || true
          lake build HighlyAbundant.IsHA.WCertsTactic HighlyAbundant.IsHA.SageKernelBeq

      - name: Unfold counts before the change
        shell: bash
        env:
          LEAN_NUM_THREADS: "2"
        run: |
          set -u
          git checkout HEAD~1 -- HighlyAbundant/IsHA/SageKernel.lean \
            HighlyAbundant/IsHA/SageKernelEquiv.lean
          lake build HighlyAbundant.IsHA.WCertsTactic HighlyAbundant.IsHA.SageKernelBeq
          start=$(date +%s)
          lake env lean -j 2 -D diagnostics=true -D diagnostics.threshold=1 \
            HighlyAbundant/IsHA/HACompose125.lean > /tmp/before.log 2>&1
          echo "before exit=$? wall_s=$(( $(date +%s) - start ))"
          cat /tmp/before.log

      - name: Unfold counts after the change
        shell: bash
        env:
          LEAN_NUM_THREADS: "2"
        run: |
          set -u
          git checkout HEAD -- HighlyAbundant/IsHA/SageKernel.lean \
            HighlyAbundant/IsHA/SageKernelEquiv.lean
          lake build HighlyAbundant.IsHA.WCertsTactic HighlyAbundant.IsHA.SageKernelBeq
          start=$(date +%s)
          lake env lean -j 2 -D diagnostics=true -D diagnostics.threshold=1 \
            HighlyAbundant/IsHA/HACompose125.lean > /tmp/after.log 2>&1
          echo "after exit=$? wall_s=$(( $(date +%s) - start ))"
          cat /tmp/after.log

      - name: Upload raw logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emit-once
          path: /tmp/*.log
