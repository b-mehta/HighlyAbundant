name: Bench

on:
  push:
    branches:
      - 'bench/**'

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          build: false

      - name: Build dependencies once
        shell: bash
        env:
          LEAN_NUM_THREADS: "3"
        run: |
          lake exe cache get || true
          lake build HighlyAbundant.IsHA.WCertsTactic HighlyAbundant.IsHA.SageKernelBeq

      - name: Interleaved wall times at the small size
        shell: bash
        env:
          LEAN_NUM_THREADS: "2"
        run: |
          set -u
          for round in 1 2 3; do
            for v in 3a07f34:base 49b2df8:emit; do
              sha=${v%%:*}; lbl=${v##*:}
              if [ $(( round % 2 )) -eq 0 ]; then
                case $lbl in base) sha=49b2df8; lbl=emit;; emit) sha=3a07f34; lbl=base;; esac
              fi
              git checkout $sha -- HighlyAbundant/IsHA/SageKernel.lean \
                HighlyAbundant/IsHA/SageKernelEquiv.lean
              lake build HighlyAbundant.IsHA.WCertsTactic HighlyAbundant.IsHA.SageKernelBeq \
                > /dev/null 2>&1
              start=$(date +%s%N)
              lake env lean -j 2 HighlyAbundant/IsHA/BenchN83.lean > /dev/null 2>&1
              echo "round=$round variant=$lbl exit=$? ms=$(( ($(date +%s%N) - start) / 1000000 ))"
            done
          done

      - name: Unfold counts before the change
        shell: bash
        env:
          LEAN_NUM_THREADS: "2"
        run: |
          set -u
          git checkout 3a07f34 -- HighlyAbundant/IsHA/SageKernel.lean \
            HighlyAbundant/IsHA/SageKernelEquiv.lean
          lake build HighlyAbundant.IsHA.WCertsTactic HighlyAbundant.IsHA.SageKernelBeq
          start=$(date +%s)
          lake env lean -j 2 -D diagnostics=true -D diagnostics.threshold=1 \
            HighlyAbundant/IsHA/HACompose125.lean > /tmp/before.log 2>&1
          echo "before exit=$? wall_s=$(( $(date +%s) - start ))"
          cat /tmp/before.log

      - name: Unfold counts after the change
        shell: bash
        env:
          LEAN_NUM_THREADS: "2"
        run: |
          set -u
          git checkout 49b2df8 -- HighlyAbundant/IsHA/SageKernel.lean \
            HighlyAbundant/IsHA/SageKernelEquiv.lean
          lake build HighlyAbundant.IsHA.WCertsTactic HighlyAbundant.IsHA.SageKernelBeq
          start=$(date +%s)
          lake env lean -j 2 -D diagnostics=true -D diagnostics.threshold=1 \
            HighlyAbundant/IsHA/HACompose125.lean > /tmp/after.log 2>&1
          echo "after exit=$? wall_s=$(( $(date +%s) - start ))"
          cat /tmp/after.log

      - name: Upload raw logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emit-once
          path: /tmp/*.log
