name: Bench

on:
  push:
    branches:
      - 'bench/**'

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          build: false

      - name: Build dependencies once
        shell: bash
        env:
          LEAN_NUM_THREADS: "3"
        run: |
          lake exe cache get || true
          lake build HighlyAbundant.IsHA.WCertsTactic

      - name: Anonymous memory of the two heaviest modules
        shell: bash
        env:
          LEAN_NUM_THREADS: "2"
        run: |
          set -u
          echo "nproc: $(nproc)"; free -m | head -2

          # Anonymous is the memory the process genuinely needs resident; the rest of
          # Rss is mapped oleans the OS can evict.
          sample_tree () {
            local root=$1
            local peak_rss=0 peak_anon=0 peak_file=0 min_avail=99999999
            local rss anon file p a r kids queue pids avail
            while kill -0 "$root" 2>/dev/null; do
              pids=$root; queue=$root
              while [ -n "$queue" ]; do
                kids=""
                for p in $queue; do kids="$kids $(pgrep -P "$p" 2>/dev/null | tr '\n' ' ')"; done
                queue=$(echo $kids); pids="$pids $queue"
              done
              rss=0; anon=0
              for p in $pids; do
                if [ -r "/proc/$p/smaps_rollup" ]; then
                  set -- $(awk '/^Rss:/{r=$2} /^Anonymous:/{a=$2} END{print r+0, a+0}' "/proc/$p/smaps_rollup" 2>/dev/null)
                  rss=$(( rss + ${1:-0} )); anon=$(( anon + ${2:-0} ))
                fi
              done
              file=$(( rss - anon ))
              avail=$(awk '/^MemAvailable/ {print $2}' /proc/meminfo)
              if [ "$rss"   -gt "$peak_rss" ];   then peak_rss=$rss;   fi
              if [ "$anon"  -gt "$peak_anon" ];  then peak_anon=$anon; fi
              if [ "$file"  -gt "$peak_file" ];  then peak_file=$file; fi
              if [ "$avail" -lt "$min_avail" ];  then min_avail=$avail; fi
              sleep 1
            done
            echo "$peak_rss $peak_anon $peak_file $min_avail"
          }

          gb () { awk "BEGIN{printf \"%.2f\", $1/1048576}"; }

          for m in HACompose169a HACompose169b; do
            start=$(date +%s)
            lake env lean -j 2 "HighlyAbundant/IsHA/$m.lean" > "/tmp/$m.log" 2>&1 &
            pid=$!
            read -r prss panon pfile mavail <<< "$(sample_tree $pid)"
            wait $pid; rc=$?
            secs=$(( $(date +%s) - start ))
            echo "$m exit=$rc wall_s=$secs rss=$(gb $prss) GB anon=$(gb $panon) GB file=$(gb $pfile) GB minAvail=$(gb $mavail) GB"
          done
