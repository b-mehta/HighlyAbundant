name = "HighlyAbundant"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["HighlyAbundant"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "843d7890de006fe2cb1d2974f5bafcf1b0e3fad8"

[[lean_lib]]
name = "HighlyAbundant"
