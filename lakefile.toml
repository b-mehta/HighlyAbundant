name = "HighlyAbundant"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["HighlyAbundant"]
moreLeanArgs = ["-j", "2"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "06e4a530c2ee8e5c0fc6ba40a38d4814102c8fa2"

[[lean_lib]]
name = "HighlyAbundant"
